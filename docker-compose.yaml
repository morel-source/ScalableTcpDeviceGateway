# ============================================================
# Scalable TCP IoT Gateway — Full Docker Compose
# ============================================================
# Two profiles:
#
#   infra      — infrastructure only (Kafka, Postgres, monitoring)
#                used when .NET services run locally via dotnet run
#
#   full       — everything including .NET services
#                used when running the full stack in Docker
#
# The simulator ALWAYS runs outside Docker:
#   dotnet run --project Device.Simulator/Device.Simulator.csproj
# ============================================================

services:

  # ════════════════════════════════════════════════════════
  # INFRASTRUCTURE — both profiles
  # ════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    profiles: [ infra, full ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    profiles: [ infra, full ]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - iot-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    profiles: [ infra, full ]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - iot-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    profiles: [ infra, full ]
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d telemetry" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iot-network
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    profiles: [ infra, full ]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - iot-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    profiles: [ infra, full ]
    ports:
      - "9090:9090"
    volumes:
      - ./Metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - iot-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    profiles: [ infra, full ]
    ports:
      - "3100:3100"
    volumes:
      - ./metrics/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - iot-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles: [ infra, full ]
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./Metrics/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Metrics/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      - iot-network

  # ════════════════════════════════════════════════════════
  # .NET SERVICES — full profile only
  # ════════════════════════════════════════════════════════

  gateway-server:
    build:
      context: .
      dockerfile: Gateway.Server/Dockerfile
    container_name: gateway-server
    restart: unless-stopped
    profiles: [ full ]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8888:8888"       # TCP — simulator connects here
      - "2222:2222"       # Prometheus metrics scrape
    environment:
      DOTNET_ENVIRONMENT: Production
      TcpServerOptions__ListenerPort: 8888
      Kafka__BootstrapServers: kafka:29092
      LokiOptions__Url: http://loki:3100
      PrometheusMonitoringOptions__KestrelMetricServerPort: 2222
      PrometheusMonitoringOptions__KestrelMetricServerHost: "0.0.0.0"
    networks:
      - iot-network

  telemetry-processor:
    build:
      context: .
      dockerfile: TelemetryProcessor/Dockerfile
    container_name: telemetry-processor
    restart: unless-stopped
    profiles: [ full ]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      KAFKA_BOOTSTRAP: kafka:29092
      ConnectionStrings__Telemetry: "Host=postgres;Database=telemetry;Username=USERNAME;Password=PASSWORD"
      LokiOptions__Url: http://loki:3100
    networks:
      - iot-network

  alert-worker:
    build:
      context: .
      dockerfile: AlertWorker/Dockerfile
    container_name: alert-worker
    restart: unless-stopped
    profiles: [ full ]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      KAFKA_BOOTSTRAP: kafka:29092
      LokiOptions__Url: http://loki:3100
    networks:
      - iot-network

volumes:
  postgres_data:
  grafana_data:
  loki-data:
  pgadmin_data:


networks:
  iot-network:
    driver: bridge